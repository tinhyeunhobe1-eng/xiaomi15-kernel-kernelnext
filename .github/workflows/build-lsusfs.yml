name: Build KernelSU Next + SUSFS
run-name: Building KernelSU Next + SUSFS ✅
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Cài đặt công cụ
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git bc bison build-essential libssl-dev libelf-dev zip curl wget python3 python-is-python3 gcc-aarch64-linux-gnu libncurses5-dev device-tree-compiler libstdc++-12-dev

      - name: 📥 Tải nguồn Kernel Xiaomi
        run: |
          # Clone nguồn Xiaomi 15 (shennong)
          git clone --depth=1 --branch shennong-qcom-android15-6.6 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          echo "✅ Nguồn kernel đã tải"

      - name: 🧠 Tích hợp KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "✅ KernelSU Next đã tích hợp"

      - name: 🔒 Tích hợp SUSFS
        run: |
          cd kernel
          git clone https://github.com/SUSFS/susfs.git susfs
          # Sao chép file SUSFS vào đúng vị trí
          cp -r susfs/Documentation/* Documentation/ 2>/dev/null || true
          echo "✅ SUSFS đã thêm vào"

      - name: ⚙️ Cấu hình Kernel
        run: |
          cd kernel
          # Sử dụng defconfig cho Xiaomi 15
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- shennong_qcom_defconfig
          # Bật KernelSU Next + SUSFS
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          echo "CONFIG_SUSFS=y" >> .config
          echo "CONFIG_SUSFS_DEBUG=n" >> .config
          echo "CONFIG_SUSFS_HIDE_KSU=y" >> .config
          # Lưu lại cấu hình
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- savedefconfig
          cp defconfig arch/arm64/configs/shennong_qcom_defconfig

      - name: 🔨 Build Kernel
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 📦 Đóng gói kết quả
        run: |
          cd kernel/arch/arm64/boot
          zip -r ../../kernel-ksusfs-result.zip Image
          cd ../..
          echo "✅ File đã đóng gói xong"
          ls -lh arch/arm64/boot/Image

      - name: 📤 Tải lên kết quả
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SUSFS
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/Image.gz
          retention-days: 60
